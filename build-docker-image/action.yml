# TODO: Boolean inputs don't work (https://github.com/actions/runner/issues/2238)

name: 'Build Docker image'
inputs:
  checkout:
    description: 'Whether to checkout code'
    required: false
    default: 'true'
  multi-platforms:
    description: 'Whether to build for multiple platforms'
    required: false
    default: 'false'
  tags:
    description: 'Tags'
    required: true
  labels:
    description: 'Labels'
    required: true
  annotations:
    description: 'Annotations'
    required: true
  push:
    description: 'Push or export locally'
    required: false
    default: 'false'
  dest:
    description: 'Where the built image should go'
    required: false
    default: '/tmp/image.tar'
outputs:
  digest:
    description: 'SHA digest of built image'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: src
        persist-credentials: false
        show-progress: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      with:
        version: https://github.com/docker/buildx.git#fa4461b9a1ec45c23d1b9e32dee0d0a8ed29900b
        driver-opts: image=moby/buildkit:v0.17.1@sha256:918e92e639651fdfd0bd97f31bab0dd91756edd14e6f73f43a896715617c59a0
    # - name: Set up QEMU
      # if: inputs.multi-platforms == 'true'
      # uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7
      # with:
        # image: tonistiigi/binfmt:qemu-v6.2.0@sha256:85683def11494bc0055d98dd1081e73cb5e70bbc1ae532be3d12cf054e2b11f1
        # platforms: arm64
    - name: Build Docker image
      id: build
      uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d
      with:
        # platforms: ${{ inputs.multi-platforms == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        context: src
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        annotations: ${{ inputs.annotations }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: ${{ inputs.push == 'true' && 'mode=max' }}
        sbom: ${{ inputs.push == 'true' }}
        outputs: ${{ inputs.push == 'true' && 'type=registry' || format('type=docker,dest={0}', inputs.dest) }}
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
