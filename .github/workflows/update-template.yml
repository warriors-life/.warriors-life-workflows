name: Update release branch from dev

on:
  workflow_call:

permissions: {}

concurrency:
  group: update-template
  cancel-in-progress: true

jobs:
  update-branch:
    name: Update release branch from dev

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0d381219ddf674d61a7572ddd19d7941e271515c
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Update
        run: |
          git checkout release
          git merge dev
          git push
